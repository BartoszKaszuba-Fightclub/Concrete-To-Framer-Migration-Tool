<!doctype html>
<html>
<head>
  <style>
    button {
      appearance: none;
      background: rgb(255, 255, 255);
      color: rgb(0, 0, 0);
      font-family: Arial, sans-serif;
      font-size: 18px;
      font-weight: 700;
      line-height: 21px;
      letter-spacing: normal;
      border-width: 2px;
      border-style: solid;
      border-radius: 0;
      padding: 8px 12px;
      margin: 8px;
    }
    .same { border-color: rgb(0, 128, 0); }
    .other { border-color: rgb(200, 0, 0); }
  </style>
</head>
<body>
  <button class="same" type="button">Save</button>
  <button class="other" type="button">Save</button>
  <button class="same" type="button">Send</button>
</body>
</html>
